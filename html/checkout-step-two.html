<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LojaQA</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="cabecalho_topo">
      <div class="cabecalho_marca">
        <button class="menu_gatilho" id="botao-menu" data-test="botao-menu" aria-label="Abrir Menu">&#9776;</button>
        <a class="logotipo" id="link-logo" data-test="link-logo" href="index.html">🧪 LojaQA</a>
      </div>
      <div class="sacola_area">
        <a class="sacola_link" id="link-carrinho" data-test="link-carrinho" href="cart.html">🛒<span class="sacola_contador" id="badge-carrinho" data-test="badge-carrinho" style="display:none"></span></a>
      </div>
    </div>
    <div class="subcabecalho">
      <span class="subcabecalho_titulo" id="titulo-pagina" data-test="titulo-pagina">Pagamento: Resumo</span>
    </div>
    <nav class="gaveta_menu" id="menu-lateral" data-test="menu-lateral">
      <button class="gaveta_fechar" id="botao-fechar-menu" data-test="botao-fechar-menu" aria-label="Fechar Menu">&times;</button>
      <a id="link-todos-itens" data-test="link-todos-itens" href="index.html">Todos os Produtos</a>
      <a id="link-sobre" data-test="link-sobre" href="sobre.html">Sobre</a>
      <a id="link-sair" data-test="link-sair" href="#">Sair</a>
      <a id="link-resetar" data-test="link-resetar" href="#">Resetar Aplicação</a>
    </nav>
    <div class="gaveta_fundo" id="sobreposicao-menu"></div>
  </header>

  <main class="pagamento_area" id="container-checkout-resumo" data-test="container-checkout-resumo">
    <div>
      <span class="coluna_qtd" data-test="rotulo-quantidade">QTD</span>
      <span class="coluna_desc" data-test="rotulo-descricao">Descrição</span>
    </div>
    <div class="sacola_itens" id="lista-resumo" data-test="lista-resumo"></div>

    <div class="resumo_bloco" id="info-resumo" data-test="info-resumo">
      <div class="resumo_rotulo" data-test="rotulo-pagamento">Forma de Pagamento:</div>
      <div class="resumo_valor" data-test="valor-pagamento">CartãoQA #31337</div>
      <div class="resumo_rotulo" data-test="rotulo-entrega">Entrega:</div>
      <div class="resumo_valor" data-test="valor-entrega">Entrega Expressa Grátis!</div>
      <div class="resumo_rotulo" data-test="rotulo-total">Resumo de Valores</div>
      <div class="resumo_subtotal" id="valor-subtotal" data-test="valor-subtotal"></div>
      <div class="resumo_imposto" id="valor-imposto" data-test="valor-imposto"></div>
      <div class="resumo_total" id="valor-total" data-test="valor-total"></div>
    </div>

    <div class="rodape_acoes">
      <a class="botao botao_contorno" id="botao-cancelar" data-test="botao-cancelar" href="index.html">Cancelar</a>
      <button class="botao botao_primario" id="botao-finalizar" data-test="botao-finalizar">Finalizar Pedido</button>
    </div>
  </main>

  <template id="modelo-item-resumo">
    <div class="sacola_linha" data-test="item-carrinho">
      <div class="linha_qtd" data-test="quantidade-item">1</div>
      <div class="linha_info">
        <a class="produto_nome" data-test="nome-item"></a>
        <div class="produto_texto" data-test="descricao-item"></div>
        <div class="linha_rodape">
          <div class="produto_valor" data-test="preco-item"></div>
        </div>
      </div>
    </div>
  </template>

  <footer class="rodape_site" id="rodape" data-test="rodape">
    <ul class="redes">
      <li><a href="https://github.com/paulovarrone" target="_blank" rel="noopener" data-test="rede-github">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/paulovarrone" target="_blank" rel="noopener" data-test="rede-linkedin">LinkedIn</a></li>
    </ul>
    <div class="rodape_direitos" data-test="texto-rodape">© 2026 LojaQA — Projeto educacional para prática de testes de automação.</div>
  </footer>

  <script src="../js/data.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/pages/checkout-overview.js" defer></script>
</body>
</html>
