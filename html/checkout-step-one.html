<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LojaQA</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="cabecalho_topo">
      <div class="cabecalho_marca">
        <button class="menu_gatilho" id="botao-menu" data-test="botao-menu" aria-label="Abrir Menu">&#9776;</button>
        <a class="logotipo" id="link-logo" data-test="link-logo" href="index.html">🧪 LojaQA</a>
      </div>
      <div class="sacola_area">
        <a class="sacola_link" id="link-carrinho" data-test="link-carrinho" href="cart.html">🛒<span class="sacola_contador" id="badge-carrinho" data-test="badge-carrinho" style="display:none"></span></a>
      </div>
    </div>
    <div class="subcabecalho">
      <span class="subcabecalho_titulo" id="titulo-pagina" data-test="titulo-pagina">Pagamento: Seus Dados</span>
    </div>
    <nav class="gaveta_menu" id="menu-lateral" data-test="menu-lateral">
      <button class="gaveta_fechar" id="botao-fechar-menu" data-test="botao-fechar-menu" aria-label="Fechar Menu">&times;</button>
      <a id="link-todos-itens" data-test="link-todos-itens" href="index.html">Todos os Produtos</a>
      <a id="link-sobre" data-test="link-sobre" href="sobre.html">Sobre</a>
      <a id="link-sair" data-test="link-sair" href="#">Sair</a>
      <a id="link-resetar" data-test="link-resetar" href="#">Resetar Aplicação</a>
    </nav>
    <div class="gaveta_fundo" id="sobreposicao-menu"></div>
  </header>

  <main class="pagamento_area" id="container-checkout-dados" data-test="container-checkout-dados">
    <form class="pagamento_form" id="form-checkout" data-test="form-checkout" novalidate>
      <input type="text" class="campo_form" id="campo-nome" data-test="campo-nome" placeholder="Nome" autofocus>
      <input type="text" class="campo_form" id="campo-sobrenome" data-test="campo-sobrenome" placeholder="Sobrenome">
      <input type="text" class="campo_form" id="campo-cep" data-test="campo-cep" placeholder="CEP">

      <div class="aviso_erro" id="container-erro" data-test="container-erro">
        <span id="texto-erro" data-test="texto-erro"></span>
        <button type="button" class="aviso_fechar" id="botao-fechar-erro" data-test="botao-fechar-erro" aria-label="Fechar">&times;</button>
      </div>

      <a class="botao botao_contorno" id="botao-cancelar" data-test="botao-cancelar" href="cart.html">Cancelar</a>
      <input type="submit" class="botao botao_primario" id="botao-continuar" data-test="botao-continuar" value="Continuar">
    </form>
  </main>

  <footer class="rodape_site" id="rodape" data-test="rodape">
    <ul class="redes">
      <li><a href="https://github.com/paulovarrone" target="_blank" rel="noopener" data-test="rede-github">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/paulovarrone" target="_blank" rel="noopener" data-test="rede-linkedin">LinkedIn</a></li>
    </ul>
    <div class="rodape_direitos" data-test="texto-rodape">© 2026 LojaQA — Projeto educacional para prática de testes de automação.</div>
  </footer>

  <script src="../js/data.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/pages/checkout-info.js" defer></script>
</body>
</html>
