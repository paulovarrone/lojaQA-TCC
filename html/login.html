<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LojaQA</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="acesso_conteudo">
    <div class="acesso_marca" data-test="logo-login">🧪 LojaQA</div>
    <p class="acesso_slogan" data-test="tagline-login">Sua loja para praticar automação de testes</p>

    <div class="acesso_pagina">
      <form class="acesso_form" id="form-login" data-test="form-login" novalidate>
        <input type="text" class="campo_form" id="campo-usuario" data-test="campo-usuario"
               placeholder="Usuário" autocomplete="username" autofocus>
        <input type="password" class="campo_form" id="campo-senha" data-test="campo-senha"
               placeholder="Senha" autocomplete="current-password">

        <div class="aviso_erro" id="container-erro" data-test="container-erro">
          <span id="texto-erro" data-test="texto-erro"></span>
          <button type="button" class="aviso_fechar" id="botao-fechar-erro" data-test="botao-fechar-erro" aria-label="Fechar">&times;</button>
        </div>

        <input type="submit" class="botao botao_primario" id="botao-entrar" data-test="botao-entrar" value="Entrar">
      </form>
    </div>

    <div class="acesso_dicas">
      <div class="dicas_usuarios" id="credenciais-login" data-test="credenciais-login">
        <h4>Usuários aceitos:</h4>
        usuario_padrao<br>
        usuario_bloqueado<br>
        usuario_problema<br>
        usuario_lento<br>
        usuario_erro<br>
        usuario_visual
      </div>
      <div class="dicas_senha" id="senha-login" data-test="senha-login">
        <h4>Senha para todos os usuários:</h4>
        senha_teste_123</div>
    </div>
  </div>

  <script src="../js/data.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/pages/login.js" defer></script>
</body>
</html>
